# Copy this file to config/hosts.yaml and fill in your real hosts.
# config/hosts.yaml is gitignored -- it is the host allowlist and may
# reference private key paths, so it should never be committed.
hosts:
  web1:
    hostname: 10.0.1.23
    port: 22
    username: rca-svc
    key_path: ~/.ssh/rca_svc_ed25519
    # Optional: restrict which log sources are permitted on this host.
    # Omit entirely to allow all sources (run `rca list-sources` for the full list).
    # allowed_sources: [journalctl_recent_errors, journalctl_service, system_messages]
