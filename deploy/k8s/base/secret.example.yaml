# Copy, fill in real values, and `kubectl apply -f` this BEFORE `kubectl apply -k deploy/k8s/base`.
# Do not commit the filled-in version.
apiVersion: v1
kind: Secret
metadata:
  name: rca-secrets
  namespace: rca-log-map
stringData:
  RCA_WEB_API_KEY: changeme
  ANTHROPIC_API_KEY: sk-ant-...
---
# One Secret holding hosts.yaml, clusters.yaml, and every SSH private key they
# reference as sibling keys -- they all get mounted into the same directory
# (/etc/rca/config), so key_path/kubeconfig_path values in hosts.yaml and
# clusters.yaml below must point at files by their key name here, e.g.
# key_path: /etc/rca/config/id_ed25519
apiVersion: v1
kind: Secret
metadata:
  name: rca-config
  namespace: rca-log-map
stringData:
  hosts.yaml: |
    hosts:
      web1:
        hostname: 10.0.1.23
        port: 22
        username: rca-svc
        key_path: /etc/rca/config/id_ed25519
  clusters.yaml: |
    clusters: {}
  id_ed25519: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    ...
    -----END OPENSSH PRIVATE KEY-----
